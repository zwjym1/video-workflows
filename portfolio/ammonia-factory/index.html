成。",speed:i.temperature<400?"温度较低，反应速率较慢。":i.temperature>480?"升温通常加快反应，但不能据此判断最终平衡组成。":"铁基催化剂加快达到平衡，不改变平衡常数。",pressure:i.pressure>=20?"提高压力有利于气体总物质的量减小的合成方向。":"较低压力下，平衡组成中氨的比例相对较低。"}}const tr={overview:{n:"00",label:"工厂总览",english:"OVERVIEW",title:"从天然气，到一滴液氨",tag:"天然气路线 · 全线总览",text:"沿着管线，观察原料如何经过造气、净化、合成和分离。点击设备，走近每一步。",equations:["N₂ + 3H₂ ⇌ 2NH₃"],note:"总览所列为合成反应，不是全厂总反应",detail:"本课件采用天然气制氢路线，合并部分工业设备用于教学。先制取并净化氢氮混合气，再进入合成回路；冷凝分离氨，未反应原料返回压缩机。",steps:[{title:"造气",text:"脱硫后的天然气与水蒸气转化，二段转化引入空气。"},{title:"净化",text:"变换提高氢含量，脱碳与甲烷化除去含碳氧化物。"},{title:"合成与分离",text:"催化合成、冷凝收集、原料循环。"}],question:"氨中的氮和氢，分别从哪里来？",answer:"这条路线中，氢主要来自天然气与水蒸气，氮来自二段转化引入的空气。空气中的氧参与反应，氮主要随气流进入后续流程。"},reforming:{n:"01",label:"造气",english:"REFORMING",title:"先把氢气制出来",tag:"转化炉 · 造气",text:"打开剖面，观察炉内管束与供热示意。天然气中的甲烷与水蒸气在催化剂作用下反应，生成含氢的混合气。",equations:["CH₄ + H₂O ⇌ CO + 3H₂"],note:"蒸汽转化 · 高温 · 镍基催化剂 · 吸热",detail:"天然气先经过脱硫，保护后续催化剂。一段蒸汽转化需要供热；二段转化引入空气，氧参与反应并供热，空气中的氮气随混合气进入后续流程。两段设备在这里作简化展示。",steps:[{title:"脱硫预处理",text:"先除去原料中的硫化物，减少催化剂中毒。"},{title:"蒸汽转化",text:"甲烷与水蒸气反应，产生 H₂ 和 CO 等组分。"},{title:"二段转化与配氮",text:"引入空气，继续转化，并带入合成所需的 N₂。"}],question:"为什么必须净化后，才能进入合成塔？",answer:"转化后的混合气并不只有氮和氢，还含有 CO、CO₂、水等组分。后续需要变换与净化，保护合成催化剂，并获得适合合成的原料气。"},purification:{n:"02",label:"净化",english:"PURIFICATION",title:"留下需要的氮和氢",tag:"变换 · 脱碳 · 甲烷化",text:"变换反应把更多 CO 转化为 CO₂，同时继续生成 H₂。再脱除 CO₂，并将微量残余含碳氧化物甲烷化。",equations:["CO + H₂O ⇌ CO₂ + H₂","CO + 3H₂ → CH₄ + H₂O","CO₂ + 4H₂ → CH₄ + 2H₂O"],note:"第一式为变换；后两式为甲烷化。脱碳为独立分离环节",detail:"先变换，再脱碳，最后甲烷化处理微量残余 CO、CO₂。甲烷化会消耗少量 H₂；生成的水在后续冷却中除去。图中将多级变换及部分冷却、分离设备作了合并。",steps:[{title:"变换增氢",text:"CO 与水蒸气反应，生成 CO₂ 和更多 H₂。"},{title:"脱碳分离",text:"吸收分离大部分 CO₂，灰色支路表示其引出。"},{title:"甲烷化精制",text:"将残余微量 CO、CO₂ 转为甲烷；冷却除水后进入压缩机。"}],question:"为什么不是只用变换塔，就完成净化？",answer:"变换把 CO 转化为 CO₂，并没有把含碳氧化物全部移出气流。因此还需要脱碳，再通过甲烷化处理微量残余 CO、CO₂，以保护后续合成催化剂。"},synthesis:{n:"03",label:"催化合成",english:"SYNTHESIS",title:"让氮与氢相遇",tag:"合成塔 · 催化反应",text:"净化后的氮气和氢气经过压缩，在铁基催化剂表面反应。橙色气流表示含氨的出口气；剖面中可观察分子示意。",equations:["N₂(g) + 3H₂(g) ⇌ 2NH₃(g)"],note:"放热反应 · 铁基催化剂",detail:"合成氨是放热、气体总物质的量减小的可逆反应。工业条件需要兼顾反应速率、平衡组成与设备成本。进料氮氢比约为 1∶3，动画粒子数量不代表配比。",steps:[{title:"压缩混合",text:"净化原料与循环气混合，压缩后送入合成回路。"},{title:"催化合成",text:"催化剂加快达到平衡，不改变平衡常数。"},{title:"出口混合气",text:"含 NH₃、未反应 N₂ 和 H₂，进入冷却分离。"}],question:"降温有利于平衡，为什么不在室温下生产？",answer:"低温虽有利于平衡组成，但反应速率较慢。工业上需要在速率、平衡和成本之间折中。"},cooling:{n:"04",label:"冷凝分离",english:"SEPARATION",title:"把氨从混合物中分离",tag:"冷凝器 · 冷却分离",text:"合成塔出口气体进入冷却与分离环节。氨在适当温压下冷凝为液体，流向储罐。",equations:["NH₃(g) → NH₃(l)"],note:"物态变化 · 不是新的化学反应",detail:"冷凝是物态变化。此处动画只示意分离过程；实际冷凝条件取决于压力和混合物组成。工业装置还会回收热量并采用多级冷却。",steps:[{title:"冷却",text:"混合气经过换热与冷却。"},{title:"气液分离",text:"液氨与未反应气体分开。"},{title:"液氨收集",text:"橙色产物流向储罐，气体进入循环支路。"}],question:"为什么可以将氨与未反应的氮、氢分开？",answer:"在合适温压下，氨比氮气和氢气更容易液化，因此可以通过冷却进行分离。"},recycle:{n:"05",label:"循环利用",english:"RECYCLE",title:"让原料再走一次",tag:"循环管路 · 原料回收",text:"未反应的氮气和氢气返回压缩机，与净化后的新鲜原料混合，再次进入合成回路。",equations:["未反应 N₂、H₂ → 合成回路"],note:"回收原料 · 提高总体利用率",detail:"循环提高原料的总体利用率，并不意味着单次反应完全转化。实际工厂还会排出少量弛放气，防止甲烷、氩等惰性组分积累；图中以文字说明这一环节。",steps:[{title:"分离氨",text:"先收集产品，剩余气体进入回流管路。"},{title:"返回压缩机",text:"未反应 N₂、H₂ 与新鲜原料会合。"},{title:"弛放与补充",text:"工业上排出少量循环气，同时补充新鲜原料。"}],question:"循环利用与提高单程转化率，是同一件事吗？",answer:"不是。单程转化率描述一次通过反应器的变化；循环使未反应原料有机会多次参与反应，提高整个系统的原料利用率。"}},vg=i=>i==="overview"||i==="synthesis",Sl={junior:{label:"初中 · 基础",summary:"衔接人教版初中九年级分子与原子、质量守恒、化学方程式及燃料相关基础知识。工业合成氨作为拓展情境，不要求掌握化学平衡或工业参数计算。"},senior:{label:"高中 · 深化",summary:"衔接人教版高中选择性必修 1《化学反应原理》的反应速率、化学平衡与反应调控，解释工艺条件、催化净化、冷凝分离及循环利用。"}},dc={overview:{objectives:["说出氨由氮、氢两种元素组成","沿管线辨认制气、净化与合成的先后顺序","区分原料、产品和未反应原料"],points:[{title:"元素有来源",text:"这条天然气路线中，氮元素来自空气中的氮气；氢元素来自天然气和水蒸气。反应不会凭空创造元素。"},{title:"一条线完成不同任务",text:"制气准备原料，净化改善气体组成，合成生成氨，冷凝收集液氨；各设备承担的任务不同。"}],misconception:"工厂总览中的合成反应式只描述氮气和氢气生成氨，不能代表全厂所有变化。",quiz:{question:"按照元素守恒，氨中的氮元素在这条路线中主要来自哪里？",options:["冷却用水","空气中的氮气","天然气中的甲烷"],correct:1,explanation:"甲烷和水不含氮元素；二段转化引入的空气提供氮气。"}},reforming:{objectives:["认识甲烷和水蒸气是制氢原料","用生成新物质判断化学变化","核对转化反应前后的原子数"],points:[{title:"加热不只是改变温度",text:"甲烷与水蒸气在一定条件下生成一氧化碳和氢气，有新物质生成，所以属于化学变化。"},{title:"数原子查守恒",text:"CH₄ + H₂O ⇌ CO + 3H₂ 两侧各有 1 个碳原子、6 个氢原子和 1 个氧原子。这里的双向箭头先理解为反应能够向两个方向进行。"}],misconception:"水蒸气不是氢气；水变成水蒸气没有产生氢气，制氢还需要发生化学反应。",quiz:{question:"甲烷与水蒸气反应生成氢气，判断它是化学变化的依据是什么？",options:["炉内温度升高","气体通过管道","生成了不同于原料的新物质"],correct:2,explanation:"判断化学变化要看是否生成新物质；受热或流动本身不能作为充分依据。"}},purification:{objectives:["认识制得的气体是混合物","解释进入下一设备前还要处理原料","区分反应处理与分离操作"],points:[{title:"混合气还要处理",text:"造气后除了所需的氢气和氮气，还含有一氧化碳、二氧化碳等组分，不能直接看作纯净原料。"},{title:"先转化，再分离",text:"变换反应继续生成氢气并将一氧化碳转为二氧化碳，脱碳环节移出大部分二氧化碳；最后处理微量残留，保护合成催化剂。"}],misconception:"“净化”不等于每一步都是过滤；气体处理可能同时涉及化学反应和混合物分离。",quiz:{question:"变换反应将一氧化碳转成二氧化碳后，为什么还要脱碳？",options:["二氧化碳仍在混合气中，需要分离出去","氮气已全部变成二氧化碳","反应后所有气体都会自动分层"],correct:0,explanation:"把一种组分转为另一种组分，并不意味着它已经离开气流，还需要后续分离。"}},synthesis:{objectives:["读出氮气、氢气和氨的化学式","理解配平保持原子数不变","认识生成氨属于化学变化"],points:[{title:"从分子看守恒",text:"N₂ + 3H₂ ⇌ 2NH₃ 中，左侧共有 2 个氮原子和 6 个氢原子，右侧也一样；原子重新组合成氨分子。"},{title:"读懂计量关系",text:"方程式中的系数表示分子个数比等计量关系，不是质量比；动画中的彩色粒子只用于辨认气体。"}],misconception:"配平方程式应改变化学式前的系数，不能把 NH₃ 中的下标改掉；那会改变物质种类。",quiz:{question:"按 N₂ + 3H₂ ⇌ 2NH₃ 的计量关系，生成 2 个氨分子需要多少个氢分子参与？",options:["2 个","3 个","6 个"],correct:1,explanation:"系数 3 对应 3 个 H₂ 分子，其中含 6 个氢原子；不要把分子数与原子数混淆。"}},cooling:{objectives:["判断氨冷凝的变化类型","认识分离可以利用物质性质差异","区分氨气和液氨的共同组成"],points:[{title:"改变状态，保留物质",text:"氨由气态变成液态后，分子仍是 NH₃。这类似水蒸气凝结成水，没有生成另一种物质。"},{title:"利用液化难易不同",text:"在适当温度、压力下，氨更容易液化，氮气和氢气主要保留在气相，便于把液氨收集出来。"}],misconception:"氨冷凝是物理变化；液氨是液态氨，不是氨溶于水形成的氨水。",quiz:{question:"氨气冷凝成为液氨时，下列哪一项保持不变？",options:["氨的物态","分子之间的距离","氨分子的化学组成"],correct:2,explanation:"物态和分子间距离会变化，氨分子仍由氮、氢原子构成，仍是 NH₃。"}},recycle:{objectives:["追踪未反应原料的返回路线","解释回收有助于节约原料","区分回收气与已经分离的产品"],points:[{title:"气流走向不同",text:"冷凝得到的液氨作为产品收集；仍留在气相中的氮气和氢气回到合成回路，获得再次反应的机会。"},{title:"减少浪费也要管理",text:"循环能提高原料利用率；工业上还要排出少量循环气，避免不参与合成的组分越积越多。"}],misconception:"循环管路里主要回收的是未反应原料，并不是把所有液氨产品送回合成塔。",quiz:{question:"把分离氨之后剩余的氮气和氢气送回合成塔，主要有什么作用？",options:["让未反应原料继续利用","把氮元素变成氢元素","使每次经过合成塔都完全反应"],correct:0,explanation:"返回的原料可以再次参与反应，从而减少浪费，但每次通过并不一定全部转化。"}}},xg={overview:{objectives:["建立天然气制氢路线的完整流程","区分原料制备、反应与分离的作用","用物料去向解释循环生产"],points:[{title:"围绕合成要求组织流程",text:"原料脱硫后进入转化，二段转化由空气带入氮气；随后变换、脱碳和甲烷化，获得适于合成的氢氮混合气。"},{title:"反应器连接分离器",text:"合成塔出口含氨及未反应的氮、氢，冷却分离出产品后回收剩余原料；工艺还兼顾热量回收、设备成本和安全。"}],misconception:"N₂ + 3H₂ ⇌ 2NH₃ 是合成塔的核心反应，不包含天然气制氢与净化的全部物料变化。",quiz:{question:"哪种流程顺序符合本课件的天然气路线？",options:["先合成，再造气，最后净化","转化制气 → 变换与净化 → 压缩合成 → 冷凝与循环","冷凝空气 → 直接获得液氨 → 循环"],correct:1,explanation:"合成之前需要制备并净化原料气；反应之后再分离产品和回收未反应原料。"}},reforming:{objectives:["写出蒸汽转化的主要反应","联系吸热反应解释转化炉供热","说明二段转化引入空气的作用"],points:[{title:"吸热转化制氢",text:"CH₄ + H₂O ⇌ CO + 3H₂ 为吸热反应，镍基催化剂加快速率，转化炉持续供热维持工况；实际产物为多组分混合气。"},{title:"空气兼顾供氧与配氮",text:"二段转化中，空气里的氧参与反应并提供部分热量，氮气则随气流成为后续合成原料；此前脱硫用于保护催化剂。"}],misconception:"合成所需的氢并非全部来自甲烷；水蒸气也提供氢元素，空气中的氮则不由甲烷反应生成。",quiz:{question:"二段转化引入空气，对后续合成氨的原料准备有什么直接意义？",options:["利用空气中的氧作为氨的组成元素","把空气中的氮全部氧化为氢气","引入合成需要的氮气，同时让氧参与转化过程"],correct:2,explanation:"氨含氮、氢元素；空气带入氮气，氧参与二段转化而非成为氨的组成元素。"}},purification:{objectives:["辨析变换、脱碳与甲烷化的目的","说明变换增氢与碳氧化物去除的关系","理解催化剂保护对流程的要求"],points:[{title:"变换提高氢产量",text:"CO + H₂O ⇌ CO₂ + H₂ 把部分 CO 转为较易后续脱除的 CO₂，同时继续生成 H₂；变换出口仍需要脱碳分离。"},{title:"精制付出少量氢的代价",text:"脱除大部分 CO₂ 后，残余微量 CO、CO₂ 通过甲烷化转为 CH₄ 和水，消耗少量 H₂；随后除水，减少合成催化剂受毒害的风险。"}],misconception:"甲烷化不是主要增氢步骤：CO + 3H₂ → CH₄ + H₂O 和 CO₂ + 4H₂ → CH₄ + 2H₂O 都消耗氢气。",quiz:{question:"关于变换与甲烷化，哪项判断正确？",options:["变换可增氢，甲烷化则消耗少量氢以处理残余碳氧化物","二者都通过分解水而大量生成氧气","甲烷化能取代全部脱碳操作且不消耗原料"],correct:0,explanation:"变换式中 H₂ 是产物，甲烷化式中 H₂ 是反应物；先脱除大量 CO₂ 可以减少精制的氢耗。"}},synthesis:{objectives:["从放热与气体计量数判断平衡趋势","区分催化剂对速率和平衡的影响","解释温度、压力条件的工业折中"],points:[{title:"平衡有利不等于生产最快",text:"N₂(g) + 3H₂(g) ⇌ 2NH₃(g) 放热。其他条件相同时，较低温度有利于平衡生成氨，但反应可能太慢，生产需选择合适温度并使用催化剂。"},{title:"压强与催化作用分开看",text:"固定温度下，压缩反应混合气有利于气体计量数减小的正向反应；高压同时增加设备与能耗负担。催化剂加快达到平衡，不改变该温度下的平衡常数。"}],misconception:"催化剂同时加快正、逆反应，不改变平衡组成；平衡时正、逆反应仍在进行，且速率相等。",quiz:{question:"在相同温度、初始组成及容积下加入合适催化剂，最终会怎样？",options:["平衡常数增大，氨的平衡含量上升","更快达到相同的平衡状态","逆反应停止，原料全部转成氨"],correct:1,explanation:"催化剂影响达到平衡的速率，不改变平衡常数或同条件下的平衡组成。"}},cooling:{objectives:["区分反应平衡与后续冷凝分离","利用液化性质差异解释气液分离","说明移出产物对反应体系的意义"],points:[{title:"先冷凝，再分出产品",text:"在适宜温压下，氨更易液化，液氨与主要含氮、氢的气相分开。冷凝条件还与混合物组成有关，不应套用纯氨的单一温度。"},{title:"分离让流程持续产出",text:"下游冷凝器主要完成物态变化和分离；反应气若重新参与反应，降低其中氨含量有利于继续生成氨，但不能把冷凝器当成合成反应器。"}],misconception:"“降低温度有利于合成平衡”和“冷却使氨液化”描述的是不同环节，不能将冷凝器中的物理变化写成生成 NH₃ 的化学反应。",quiz:{question:"合成塔出口冷却后分出液氨，主要利用了什么？",options:["氨能在冷凝器中分解为纯氮和纯氢","氮气会先完全液化而氨不变","适宜工况下氨比氮气、氢气更易液化"],correct:2,explanation:"通过物态差异实现气液分离；氨的冷凝过程不改变 NH₃ 的化学组成。"}},recycle:{objectives:["区分单程转化率与总体原料利用率","解释分离与回流的配合作用","说明弛放气排放的必要性"],points:[{title:"多次通过提高总体利用率",text:"单程转化率衡量一次通过反应器时原料转化的比例；回收未反应的氮、氢再送入，可在多次通过后提高新鲜原料的总体利用率。"},{title:"循环不是完全封闭",text:"甲烷、氩等组分会随回流积累，因此需排出少量弛放气并补充新鲜原料。弛放也带走部分氮、氢，实际原料利用率并非必然达到 100%。"}],misconception:"循环提高总体利用率不等于提高每次的单程转化率，也不改变同温度下的平衡常数。",quiz:{question:"单程转化率不高时，工厂仍能较充分利用新鲜原料，主要原因是什么？",options:["分出氨后回收未反应原料，使其多次参与反应","循环管路改变了合成氨反应的平衡常数","只要回流就可以取消全部弛放气"],correct:0,explanation:"循环增加原料参与反应的机会；每次反应仍受工况限制，惰性组分积累仍需处理。"}}},El={junior:dc,senior:xg};function fc(i,t){const e=Object.hasOwn(El,i)?El[i]:dc;return Object.hasOwn(e,t)?e[t]:e.overview}const Ve=[{id:"desulfur",stage:"reforming",name:"脱硫预处理"},{id:"furnace",stage:"reforming",name:"蒸汽转化炉"},{id:"secondary",stage:"reforming",name:"二段转化"},{id:"shift",stage:"purification",name:"变换塔"},{id:"decarb",stage:"purification",name:"脱碳塔"},{id:"methanator",stage:"purification",name:"甲烷化"},{id:"compressor",stage:"synthesis",name:"压缩机"},{id:"exchanger",stage:"synthesis",name:"换热器"},{id:"reactor",stage:"synthesis",name:"合成塔"},{id:"cooler",stage:"cooling",name:"冷凝分离器"},{id:"storage",stage:"cooling",name:"液氨储罐"},{id:"recycle",stage:"recycle",name:"循环管路"}],Mg=i=>i<Ve.length-1?i+1:null,yg={desulfur:{text:"天然气先除去硫杂质，保护后续转化催化剂。",equations:["含硫天然气 → 脱硫后的天然气"],note:"预处理示意 · 未展示全部脱硫反应",detail:"硫化物可能使催化剂失活。本设备合并表示工业原料脱硫处理，不是简单的颗粒过滤。"},furnace:{text:"甲烷与水蒸气在受热管束中反应，制得含氢混合气。剖面可观察管束与炉膛供热。",equations:["CH₄ + H₂O ⇌ CO + 3H₂"],note:"吸热 · 高温 · 镍基催化剂",detail:"炉膛提供热量，原料在转化管中反应。炉火与工艺气流分开，不能把供热燃烧等同于管内的蒸
