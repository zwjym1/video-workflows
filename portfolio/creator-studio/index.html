<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>片序 · 在线创作体验</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#">◈ <strong>片序</strong><span>CREATOR STUDIO</span></a><a href="https://zwjym1.github.io/video-workflows/portfolio/">← 返回作品集</a></header>
<main><aside><span class="eyebrow">ONLINE WORKSPACE</span><h1>从想法到<br><em>可执行分镜。</em></h1><p>整理讲稿、安排镜头、导出字幕。浏览器体验版无需账户，项目保存在当前浏览器。</p><div class="note"><strong>体验版边界</strong><p>这个在线版本支持手动编辑与导出；AI 生成、配音和视频渲染目前仅在本机完整版可用，尚未部署云端。</p></div><a class="sample" href="https://zwjym1.github.io/video-workflows/portfolio/#video-wagon-wheel-demo">观看已有科普作品 ↗</a></aside>
<section class="workspace"><div class="top"><div><span class="eyebrow">YOUR PROJECT</span><h2>制作工作台</h2></div><span id="save-status" role="status">自动保存在本机浏览器</span></div><label>项目名称<input id="title" maxlength="100" value="车轮为什么看起来在倒转？"></label><label>创作目标<textarea id="brief" rows="2" maxlength="2000" placeholder="例如：为观众解释一个现象，控制在 60 秒内。"></textarea></label><div class="subhead"><div><h3>讲稿与分镜</h3><p>编辑示例，或者添加你自己的镜头。</p></div><button id="add" type="button">＋ 添加镜头</button></div><div id="scenes"></div><div class="actions"><button id="export-srt" type="button" class="primary">导出 SRT 字幕</button><button id="export-json" type="button">导出项目 JSON</button></div><p class="hint">字幕时间按填写的镜头时长估算，未与配音对齐。请自行核对内容及时间。</p></section></main><script src="app.js" defer></script></body></html>
